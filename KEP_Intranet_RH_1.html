<style>:root{
  --white:#FFFFFF; --bg:#FFFFFF; --subtle:#F8F8FA; --hover:#F3F3F6;
  --border:#E5E5EA; --border-strong:#D2D2DA;
  --text:#16161D; --text-2:#4B4B57; --muted:#6B6B78;
  --brand:#F15A24; --brand-strong:#C2410C; --brand-hover:#A8380A; --brand-tint:#FEF1EB;
  --accent:#5B2A86; --accent-tint:#F4EEF9;
  --ok:#15803D; --ok-tint:#ECF8F0; --warn:#A15C07; --warn-tint:#FFF6E5;
  --err:#B91C1C; --err-tint:#FDF0F0; --info:#1D4ED8; --info-tint:#EEF3FF;
  --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s5:24px; --s6:32px; --s7:48px; --s8:64px;
  --r1:6px; --r2:10px; --r3:14px;
  --shadow-pop:0 12px 32px rgba(22,22,29,.12), 0 2px 6px rgba(22,22,29,.06);
  --font:'IBM Plex Sans', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  --mono:'IBM Plex Mono', ui-monospace, 'SFMono-Regular', Consolas, monospace;
  --side:264px;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
body{min-width:1280px}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--brand-strong)}
h1,h2,h3,h4{margin:0;line-height:1.2;font-weight:600;letter-spacing:-.01em}
h1{font-size:26px} h2{font-size:19px} h3{font-size:16px}
.mono{font-family:var(--mono);font-size:13px;letter-spacing:-.01em}
.muted{color:var(--muted)} .small{font-size:13px} .xs{font-size:12px}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* ---------- Shell ---------- */
.app{display:grid;grid-template-columns:var(--side) 1fr;min-height:100vh}
.side{position:sticky;top:0;height:100vh;border-right:1px solid var(--border);display:flex;flex-direction:column;background:var(--white)}
.side .brand{display:flex;align-items:center;gap:var(--s3);padding:var(--s5) var(--s5) var(--s4)}
.side .brand img{height:44px;width:auto;display:block}
.side .brand-sub{font-size:12px;color:var(--muted);border-left:1px solid var(--border);padding-left:var(--s3);line-height:1.3}
.nav{flex:1;overflow:auto;padding:var(--s2) var(--s3) var(--s4)}
.nav-group{margin-top:var(--s4)}
.nav-label{font-size:11.5px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);padding:0 var(--s3) var(--s2)}
.nav button{all:unset;box-sizing:border-box;display:flex;align-items:center;gap:var(--s3);width:100%;min-height:40px;padding:0 var(--s3);border-radius:var(--r1);cursor:pointer;color:var(--text-2);font-size:14.5px;position:relative}
.nav button:hover{background:var(--hover);color:var(--text)}
.nav button:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.nav button.on{background:var(--brand-tint);color:var(--brand-strong);font-weight:600}
.nav button.on::before{content:"";position:absolute;left:-12px;top:8px;bottom:8px;width:3px;border-radius:2px;background:var(--brand)}
.nav button svg{flex:none;width:18px;height:18px}
.nav .count{margin-left:auto;font-size:12px;font-weight:600;min-width:22px;height:20px;padding:0 6px;border-radius:10px;background:var(--brand-strong);color:#fff;display:inline-flex;align-items:center;justify-content:center}
.side-foot{border-top:1px solid var(--border);padding:var(--s4) var(--s5);font-size:12px;color:var(--muted)}

.top{position:sticky;top:0;z-index:20;height:68px;display:flex;align-items:center;gap:var(--s4);padding:0 var(--s6);border-bottom:1px solid var(--border);background:rgba(255,255,255,.96);backdrop-filter:blur(6px)}
.search{flex:1;min-width:280px;max-width:460px;position:relative}
.search input{width:100%;height:40px;border:1px solid var(--border);border-radius:var(--r1);padding:0 var(--s3) 0 38px;background:var(--subtle)}
.search input:focus{background:#fff;border-color:var(--border-strong)}
.search svg{position:absolute;left:12px;top:11px;width:18px;height:18px;color:var(--muted)}
.search-res{position:absolute;top:46px;left:0;right:0;background:#fff;border:1px solid var(--border);border-radius:var(--r2);box-shadow:var(--shadow-pop);padding:var(--s2);z-index:40}
.search-res button{all:unset;box-sizing:border-box;display:flex;gap:var(--s3);align-items:center;width:100%;padding:var(--s2) var(--s3);border-radius:var(--r1);cursor:pointer}
.search-res button:hover,.search-res button:focus-visible{background:var(--hover)}
.top-spacer{flex:1}
.role-switch{white-space:nowrap;display:flex;align-items:center;gap:var(--s2);font-size:13px;color:var(--muted)}
.role-switch select{height:40px;border:1px solid var(--border);border-radius:var(--r1);padding:0 var(--s3);background:#fff;font-weight:500;color:var(--text);cursor:pointer}
.icon-btn{all:unset;box-sizing:border-box;width:44px;height:44px;border-radius:var(--r1);display:inline-flex;align-items:center;justify-content:center;cursor:pointer;color:var(--text-2);position:relative}
.icon-btn:hover{background:var(--hover)}
.icon-btn:focus-visible{outline:2px solid var(--accent)}
.icon-btn svg{width:20px;height:20px}
.dot{position:absolute;top:9px;right:9px;min-width:16px;height:16px;border-radius:8px;background:var(--brand-strong);color:#fff;font-size:10.5px;font-weight:700;display:flex;align-items:center;justify-content:center;padding:0 4px;border:2px solid #fff}
.me{display:flex;align-items:center;gap:var(--s3);padding-left:var(--s4);border-left:1px solid var(--border)}
.me .who{line-height:1.25}
.me .who b{display:block;font-size:14px;font-weight:600}
.me .who span{font-size:12px;color:var(--muted)}
.av{width:36px;height:36px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:13px;font-weight:600;flex:none;background:var(--accent-tint);color:var(--accent)}
.av.sm{width:28px;height:28px;font-size:11px}
.av.lg{width:64px;height:64px;font-size:22px}

.main{min-width:0}
.page{padding:var(--s6) var(--s6) var(--s8);max-width:1440px}
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:var(--s5);margin-bottom:var(--s5)}
.page-head p{margin:var(--s2) 0 0;color:var(--muted)}
.crumb{font-size:13px;color:var(--muted);margin-bottom:var(--s2)}

/* ---------- Building blocks ---------- */
.grid{display:grid;gap:var(--s5)}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))} .g3{grid-template-columns:repeat(3,minmax(0,1fr))} .g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g-main{grid-template-columns:minmax(0,2fr) minmax(0,1fr)}
.panel{border:1px solid var(--border);border-radius:var(--r2);background:#fff}
.panel-h{display:flex;align-items:center;justify-content:space-between;gap:var(--s3);padding:var(--s4) var(--s5);border-bottom:1px solid var(--border)}
.panel-h h2,.panel-h h3{font-size:16px}
.panel-b{padding:var(--s5)}
.panel-b.tight{padding:0}
.stack>*+*{margin-top:var(--s4)}

.kpi{border:1px solid var(--border);border-radius:var(--r2);padding:var(--s4) var(--s5);background:#fff}
.kpi .k-l{font-size:13px;color:var(--muted)}
.kpi .k-v{font-size:28px;font-weight:600;letter-spacing:-.02em;margin-top:var(--s1);font-variant-numeric:tabular-nums}
.kpi .k-v small{font-size:15px;font-weight:500;color:var(--muted);margin-left:2px}
.kpi .k-s{font-size:12.5px;color:var(--muted);margin-top:var(--s1)}
.kpi.hero{border-color:var(--brand);background:linear-gradient(0deg,#fff,#fff)}
.kpi.hero .k-v{color:var(--brand-strong)}

.btn{all:unset;box-sizing:border-box;display:inline-flex;align-items:center;justify-content:center;gap:var(--s2);height:40px;padding:0 var(--s4);border-radius:var(--r1);font-size:14.5px;font-weight:500;cursor:pointer;border:1px solid var(--border-strong);background:#fff;color:var(--text);white-space:nowrap;transition:background .15s ease-out,border-color .15s ease-out}
.btn:hover{background:var(--hover)}
.btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn svg{width:17px;height:17px}
.btn.primary{background:var(--brand-strong);border-color:var(--brand-strong);color:#fff}
.btn.primary:hover{background:var(--brand-hover);border-color:var(--brand-hover)}
.btn.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.btn.ok:hover{background:#116632}
.btn.danger{color:var(--err);border-color:#F1C4C4}
.btn.danger:hover{background:var(--err-tint)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--text-2)}
.btn.ghost:hover{background:var(--hover)}
.btn.sm{height:34px;padding:0 var(--s3);font-size:13.5px}
.btn[disabled]{opacity:.45;pointer-events:none}
.btn-row{display:flex;gap:var(--s2);flex-wrap:wrap;align-items:center}

.badge{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 10px;border-radius:12px;font-size:12.5px;font-weight:500;white-space:nowrap;border:1px solid transparent}
.badge::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.badge.nodot::before{display:none}
.b-pending{background:var(--warn-tint);color:var(--warn)}
.b-ok{background:var(--ok-tint);color:var(--ok)}
.b-err{background:var(--err-tint);color:var(--err)}
.b-info{background:var(--info-tint);color:var(--info)}
.b-muted{background:var(--hover);color:var(--text-2)}
.b-accent{background:var(--accent-tint);color:var(--accent)}
.b-brand{background:var(--brand-tint);color:var(--brand-strong)}

table.t{width:100%;border-collapse:collapse;font-size:14px}
.t th{text-align:left;font-weight:600;font-size:12.5px;color:var(--muted);padding:10px var(--s4);border-bottom:1px solid var(--border);background:var(--subtle);white-space:nowrap}
.t td{padding:12px var(--s4);border-bottom:1px solid var(--border);vertical-align:middle}
.t tr:last-child td{border-bottom:none}
.t tbody tr.click{cursor:pointer}
.t tbody tr.click:hover td{background:var(--subtle)}
.t .num{text-align:right;font-variant-numeric:tabular-nums}
.t td.wrap{white-space:normal}
.t td.mono{white-space:nowrap}
.toolbar .select{max-width:340px}
.person{display:flex;align-items:center;gap:var(--s3)}
.person b{font-weight:500;display:block;line-height:1.25}
.person span{font-size:12.5px;color:var(--muted)}

.field{display:flex;flex-direction:column;gap:6px}
.field label,.lbl{font-size:13.5px;font-weight:500;color:var(--text-2)}
.field .req{color:var(--err)}
.input,.select,.textarea{height:42px;border:1px solid var(--border-strong);border-radius:var(--r1);padding:0 var(--s3);background:#fff;width:100%}
.textarea{height:auto;min-height:84px;padding:var(--s2) var(--s3);resize:vertical}
.input:focus,.select:focus,.textarea:focus{outline:2px solid var(--accent);outline-offset:-1px;border-color:var(--accent)}
.input.bad{border-color:var(--err)}
.hint{font-size:12.5px;color:var(--muted)}
.err-msg{font-size:12.5px;color:var(--err)}
.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:var(--s4) var(--s5)}
.form-grid .full{grid-column:1/-1}
.radio-row{display:flex;gap:var(--s2);flex-wrap:wrap}
.chip{all:unset;box-sizing:border-box;display:inline-flex;align-items:center;height:36px;padding:0 var(--s3);border:1px solid var(--border-strong);border-radius:18px;font-size:13.5px;cursor:pointer;background:#fff}
.chip:hover{background:var(--hover)}
.chip.on{border-color:var(--brand-strong);background:var(--brand-tint);color:var(--brand-strong);font-weight:500}
.chip:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.drop{border:1.5px dashed var(--border-strong);border-radius:var(--r2);padding:var(--s4);display:flex;align-items:center;gap:var(--s3);color:var(--text-2);font-size:14px;cursor:pointer;background:var(--subtle)}
.drop:hover{border-color:var(--brand)}
.drop input{display:none}

.alert{display:flex;gap:var(--s3);padding:var(--s3) var(--s4);border-radius:var(--r1);font-size:14px;align-items:flex-start;border:1px solid}
.alert svg{flex:none;width:18px;height:18px;margin-top:2px}
.alert.warn{background:var(--warn-tint);color:#7A4505;border-color:#F5DDB0}
.alert.err{background:var(--err-tint);color:#8F1515;border-color:#F3C9C9}
.alert.ok{background:var(--ok-tint);color:#0F5C2C;border-color:#BFE5CC}
.alert.info{background:var(--info-tint);color:#173EA8;border-color:#CCD9FB}

.tabs{display:flex;gap:var(--s1);border-bottom:1px solid var(--border);margin-bottom:var(--s5)}
.tabs button{all:unset;cursor:pointer;padding:var(--s3) var(--s4);font-size:14.5px;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px;font-weight:500}
.tabs button:hover{color:var(--text)}
.tabs button.on{color:var(--text);border-color:var(--brand)}
.tabs button:focus-visible{outline:2px solid var(--accent)}

.dl{display:grid;grid-template-columns:180px 1fr;gap:10px var(--s4);font-size:14px;margin:0}
.dl dt{color:var(--muted)}
.dl dd{margin:0;font-weight:500}

/* Workflow stepper */
.steps{display:flex;align-items:flex-start;gap:0;margin:0;padding:0;list-style:none}
.steps li{flex:1;position:relative;padding-top:30px;font-size:12.5px;text-align:center;color:var(--muted);min-width:0}
.steps li::before{content:"";position:absolute;top:11px;left:-50%;right:50%;height:2px;background:var(--border)}
.steps li:first-child::before{display:none}
.steps li .sd{position:absolute;top:0;left:50%;transform:translateX(-50%);width:24px;height:24px;border-radius:50%;border:2px solid var(--border-strong);background:#fff;display:flex;align-items:center;justify-content:center;z-index:1}
.steps li .sd svg{width:13px;height:13px}
.steps li.done{color:var(--text-2)}
.steps li.done .sd{background:var(--ok);border-color:var(--ok);color:#fff}
.steps li.done::before,.steps li.cur::before{background:var(--ok)}
.steps li.cur{color:var(--text);font-weight:600}
.steps li.cur .sd{border-color:var(--brand);background:var(--brand-tint)}
.steps li.cur .sd::after{content:"";width:8px;height:8px;border-radius:50%;background:var(--brand)}
.steps li.bad .sd{background:var(--err);border-color:var(--err);color:#fff}
.steps li.ret .sd{background:var(--warn);border-color:var(--warn);color:#fff}
.steps li.skip{opacity:.5}
.steps li .who{display:block;font-weight:400;font-size:11.5px;color:var(--muted);margin-top:2px}

/* Timeline (historique) */
.tl{list-style:none;margin:0;padding:0}
.tl li{position:relative;padding:0 0 var(--s4) 28px}
.tl li::before{content:"";position:absolute;left:7px;top:6px;bottom:-6px;width:2px;background:var(--border)}
.tl li:last-child::before{display:none}
.tl li::after{content:"";position:absolute;left:2px;top:4px;width:12px;height:12px;border-radius:50%;background:#fff;border:2px solid var(--accent)}
.tl li.brand::after{border-color:var(--brand)}
.tl .when{font-size:12.5px;color:var(--muted)}

/* Drawer & modal */
.scrim{position:fixed;inset:0;background:rgba(22,22,29,.32);z-index:60;animation:fade .2s ease-out}
.drawer{position:fixed;top:0;right:0;bottom:0;width:640px;max-width:92vw;background:#fff;z-index:61;display:flex;flex-direction:column;box-shadow:var(--shadow-pop);animation:slide .25s ease-out}
.drawer-h{display:flex;align-items:flex-start;justify-content:space-between;gap:var(--s4);padding:var(--s5) var(--s5) var(--s4);border-bottom:1px solid var(--border)}
.drawer-b{flex:1;overflow:auto;padding:var(--s5)}
.drawer-f{border-top:1px solid var(--border);padding:var(--s4) var(--s5);display:flex;gap:var(--s2);justify-content:flex-end;align-items:center;background:#fff}
.modal{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);width:520px;max-width:92vw;background:#fff;border-radius:var(--r3);z-index:61;box-shadow:var(--shadow-pop);animation:pop .2s ease-out}
.modal .mh{padding:var(--s5) var(--s5) 0}
.modal .mb{padding:var(--s4) var(--s5)}
.modal .mf{padding:0 var(--s5) var(--s5);display:flex;gap:var(--s2);justify-content:flex-end}
@keyframes fade{from{opacity:0}}
@keyframes slide{from{transform:translateX(24px);opacity:.6}}
@keyframes pop{from{opacity:0;transform:translate(-50%,-48%)}}

.toast-wrap{position:fixed;left:calc(var(--side) + 24px);bottom:24px;z-index:80;display:flex;flex-direction:column;gap:var(--s2)}
.toast{display:flex;gap:var(--s3);align-items:center;background:var(--text);color:#fff;padding:var(--s3) var(--s4);border-radius:var(--r2);font-size:14px;box-shadow:var(--shadow-pop);animation:pop2 .2s ease-out;max-width:420px}
.toast svg{width:18px;height:18px;flex:none;color:#7BD69A}
.toast.err{background:#8F1515}.toast.err svg{color:#FFD4D4}
@keyframes pop2{from{opacity:0;transform:translateY(8px)}}

.popover{position:absolute;top:56px;right:0;width:400px;background:#fff;border:1px solid var(--border);border-radius:var(--r2);box-shadow:var(--shadow-pop);z-index:40}
.notif{display:flex;gap:var(--s3);padding:var(--s3) var(--s4);border-bottom:1px solid var(--border);font-size:13.5px}
.notif:last-child{border-bottom:none}
.notif.unread{background:var(--brand-tint)}
.notif .nd{width:8px;height:8px;border-radius:50%;background:var(--brand);margin-top:6px;flex:none}
.notif.read .nd{background:transparent}

.empty{text-align:center;padding:var(--s7) var(--s5);color:var(--muted)}
.empty svg{width:40px;height:40px;color:var(--border-strong);margin-bottom:var(--s3)}
.empty b{display:block;color:var(--text);font-weight:600;margin-bottom:var(--s1)}

/* Balance meter */
.meter{height:8px;border-radius:4px;background:var(--hover);overflow:hidden;display:flex}
.meter i{display:block;height:100%}
.legend{display:flex;gap:var(--s4);font-size:12.5px;color:var(--muted);flex-wrap:wrap}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:2px;display:inline-block}

/* Calc summary */
.calc{border:1px solid var(--border);border-radius:var(--r2);background:var(--subtle);padding:var(--s4) var(--s5)}
.big{font-size:32px;font-weight:600;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.calc-row{display:flex;justify-content:space-between;font-size:14px;padding:6px 0;border-top:1px solid var(--border)}
.calc-row:first-of-type{border-top:none}

/* Planning grids */
.gantt{overflow:auto;border:1px solid var(--border);border-radius:var(--r2)}
.gantt table{border-collapse:collapse;font-size:12.5px}
.gantt th,.gantt td{border-bottom:1px solid var(--border);padding:0;height:34px}
.gantt .nm{position:sticky;left:0;background:#fff;z-index:2;min-width:220px;padding:0 var(--s3);border-right:1px solid var(--border);text-align:left;white-space:nowrap}
.gantt thead th{background:var(--subtle);font-weight:600;color:var(--muted);height:30px;position:sticky;top:0}
.gantt thead th.nm{z-index:3;background:var(--subtle)}
.gantt .c{min-width:22px;width:22px;text-align:center;border-left:1px solid #F1F1F4}
.gantt .c.wk{background:#FBFBFC}
.gantt .c.today{box-shadow:inset 2px 0 0 var(--brand)}
.cell-on{background:var(--accent);opacity:.85}
.cell-off{background:transparent}
.cell-abs{background:var(--brand)}
.cell-prev{background:var(--accent-tint);box-shadow:inset 0 0 0 1px #C9B3DE}
.cell-eff{background:var(--accent)}
.cell-low{background:var(--err-tint);color:var(--err);font-weight:700}
.sumrow td{background:var(--subtle);font-weight:600}

/* Library */
.doc-row{display:flex;gap:var(--s4);align-items:center;padding:var(--s4) var(--s5);border-bottom:1px solid var(--border)}
.doc-row:last-child{border-bottom:none}
.doc-ic{width:40px;height:48px;border-radius:4px;border:1px solid var(--border-strong);display:flex;align-items:flex-end;justify-content:center;font-size:10px;font-weight:700;color:var(--err);padding-bottom:5px;flex:none;position:relative;background:#fff}
.doc-ic::after{content:"";position:absolute;top:-1px;right:-1px;width:12px;height:12px;background:linear-gradient(225deg,#fff 50%,var(--border-strong) 50%)}
.cat-list button{all:unset;box-sizing:border-box;display:flex;justify-content:space-between;width:100%;padding:var(--s2) var(--s3);border-radius:var(--r1);cursor:pointer;font-size:14px;color:var(--text-2);min-height:38px;align-items:center}
.cat-list button:hover{background:var(--hover)}
.cat-list button.on{background:var(--brand-tint);color:var(--brand-strong);font-weight:600}
.cat-list button:focus-visible{outline:2px solid var(--accent)}

/* Charts */
.chart svg{display:block;width:100%;height:auto}
.chart text{font-family:var(--font)}

/* Org tree */
.org{display:flex;flex-direction:column;gap:var(--s2)}
.org-node{display:flex;align-items:center;gap:var(--s3);padding:var(--s2) var(--s3);border:1px solid var(--border);border-radius:var(--r1);background:#fff}
.org-kids{margin-left:22px;padding-left:var(--s4);border-left:1px dashed var(--border-strong);display:flex;flex-direction:column;gap:var(--s2)}
.org-tag{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);width:92px}

.matrix td,.matrix th{text-align:center}
.matrix td:first-child,.matrix th:first-child{text-align:left}
.check{color:var(--ok)} .cross{color:var(--border-strong)}
.switch{all:unset;width:40px;height:24px;border-radius:12px;background:var(--border-strong);position:relative;cursor:pointer;flex:none;transition:background .15s}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:left .15s;box-shadow:0 1px 2px rgba(0,0,0,.2)}
.switch.on{background:var(--ok)}
.switch.on::after{left:19px}
.switch:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.wf-step{display:grid;grid-template-columns:36px 1fr 260px 120px 48px;gap:var(--s4);align-items:center;padding:var(--s3) var(--s4);border:1px solid var(--border);border-radius:var(--r1);background:#fff}
.wf-num{width:28px;height:28px;border-radius:50%;background:var(--accent-tint);color:var(--accent);font-weight:600;display:flex;align-items:center;justify-content:center;font-size:13px}
.wf-arrow{margin-left:30px;height:16px;border-left:2px solid var(--border)}

.ticket-msg{border:1px solid var(--border);border-radius:var(--r2);padding:var(--s3) var(--s4);font-size:14px}

const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const emp = id => EMP.find(e => e.id === +id);
const fullName = e => e ? `${e.prenom} ${e.nom}` : '—';
const initials = e => e ? (e.prenom[0] + e.nom[0]).toUpperCase() : '?';
const orgName = c => (ORG.find(o => o.code === c) || {}).name || c;
const dirOf = code => { let o = ORG.find(x => x.code === code); while (o && o.kind !== 'Direction') o = ORG.find(x => x.code === o.parent); return o ? o.code : code; };
const MONTHS = ['janv.', 'févr.', 'mars', 'avr.', 'mai', 'juin', 'juil.', 'août', 'sept.', 'oct.', 'nov.', 'déc.'];
const MONTHS_L = ['janvier', 'février', 'mars', 'avril', 'mai', 'juin', 'juillet', 'août', 'septembre', 'octobre', 'novembre', 'décembre'];
const DAYS = ['dim.', 'lun.', 'mar.', 'mer.', 'jeu.', 'ven.', 'sam.'];
const D = s => new Date(s + 'T00:00:00Z');
const iso = d => d.toISOString().slice(0, 10);
const addDays = (s, n) => { const d = D(s); d.setUTCDate(d.getUTCDate() + n); return iso(d); };
const diffDays = (a, b) => Math.round((D(b) - D(a)) / 864e5);
const fd = s => { if (!s) return '—'; const d = D(s.slice(0, 10)); return `${d.getUTCDate()} ${MONTHS[d.getUTCMonth()]} ${d.getUTCFullYear()}`; };
const fdShort = s => { const d = D(s); return `${d.getUTCDate()} ${MONTHS[d.getUTCMonth()]}`; };
const fdt = s => s.length > 10 ? `${fd(s)} · ${s.slice(11, 16)}` : fd(s);
const money = n => new Intl.NumberFormat('fr-FR').format(Math.round(n)).replace(/ /g, ' ') + ' XAF';
const num = (n, d = 1) => new Intl.NumberFormat('fr-FR', { maximumFractionDigits: d }).format(n);
const holidaySet = () => new Set(HOLIDAYS.map(h => h[0]));
const isWeekend = s => { const g = D(s).getUTCDay(); return g === 0 || g === 6 || (g === 6 && !SETTINGS.samedi); };
const nowStamp = () => { const t = new Date(); return `${TODAY} ${String(t.getHours()).padStart(2, '0')}:${String(t.getMinutes()).padStart(2, '0')}`; };
const SETTINGS = { samedi: false, seuilEquipe: 2 };

function workingDays(from, to, half = '') {
  if (!from || !to || to < from) return 0;
  const hs = holidaySet(); let n = 0;
  for (let d = from; d <= to; d = addDays(d, 1)) {
    const g = D(d).getUTCDay();
    const we = g === 0 || (g === 6 && !SETTINGS.samedi);
    if (!we && !hs.has(d)) n++;
  }
  if (half === 'debut' || half === 'fin') n -= .5;
  if (half === 'deux') n -= 1;
  return Math.max(n, 0);
}

function balance(e) {
  const pend = REQUESTS.filter(r => r.emp === e.id && r.status === 'pending' && absType(r.type).decompte).reduce((s, r) => s + workingDays(r.from, r.to, r.half), 0);

  return { rel: e.solde.rel, acq: e.solde.acq, pris: e.solde.pris, dispo, pend, net: dispo - pend };
}

/* ---------- Moteur de workflow ---------- */
const APPROVER_ROLE = { RH: [3], DIRH: [2], DG: [1], FIN: [4] };
function stepsFor(r) {
  const wf = WORKFLOWS[r.kind];
  return wf.steps.filter(s => {
    if (!s.on) return false;
    if (r.kind === 'ABS' && s.key === 'DG') return workingDays(r.from, r.to, r.half) > 15 || r.type === 'CSS';
    return true;
  });
}
function approversFor(r, key) {
  if (key === 'N1') return [emp(r.emp).mgr];
  const ids = ACCOUNTS.filter(a => a.role === key && a.status === 'actif').map(a => a.emp);
  return ids.length ? ids : APPROVER_ROLE[key];
}
const approverNames = (r, key) => approversFor(r, key).map(i => fullName(emp(i))).join(', ');
function currentStep(r) { const st = stepsFor(r); return st[r.step]; }
function delegatedTo(id) {
  return S.delegations.filter(d => d.to === id && TODAY >= d.du && TODAY <= d.au).map(d => d.from);
}
function canAct(r, uid = me().id) {
  if (r.status !== 'pending') return false;
  const cs = currentStep(r); if (!cs) return false;
  const ap = approversFor(r, cs.key);
  if (r.emp === uid) return false; // séparation des tâches
  return ap.includes(uid) || delegatedTo(uid).some(x => ap.includes(x));
}
const allItems = () => [...REQUESTS, ...MISSIONS];

function statusBadge(r) {

  if (r.status === 'approved') return r.kind === 'MIS' ? '<span class="badge b-ok">Approuvée · avance versée</span>' : '<span class="badge b-ok">Approuvée</span>';

}

function notify(to, txt, ref = null) { NOTIFS.unshift({ to, date: nowStamp(), txt, ref, read: false }); }
function audit(action, objet, avant, apres, motif = '', by = null) {
  const uid = by ?? (S.user ? me().id : 0);

}
const stepLabel = r => { const cs = currentStep(r); return r.status === 'pending' && cs ? 'En attente ' + cs.label : ({ approved: 'Approuvée', rejected: 'Rejetée', returned: 'Retournée', cancelled: 'Annulée' }[r.status] || r.status); };

function decide(r, act, com) {
  const cs = currentStep(r); const avant = stepLabel(r);
  r.hist.push({ by: me().id, step: cs.key, act, date: nowStamp(), com });
  const who = fullName(emp(r.emp)); const label = r.kind === 'ABS' ? 'demande d’absence' : 'mission';
  if (act === 'approve') {
    r.step++;
    const st = stepsFor(r);
    if (r.step >= st.length) {
      r.status = 'approved';
      if (r.kind === 'ABS') {
        if (absType(r.type).decompte) emp(r.emp).solde.pris += workingDays(r.from, r.to, r.half);
        notify(r.emp, `Votre ${label} ${r.id} est approuvée et archivée.`, r.id);
        notify(19, `Absence approuvée : ${who}, du ${fd(r.from)} au ${fd(r.to)}.`, r.id);
      } else {
        notify(r.emp, `Votre mission ${r.id} est approuvée. L’avance de ${money(sumAv(r))} est versée par la DIFI.`, r.id);
        notify(5, `Mission ${r.id} approuvée : organiser le voyage de ${who} (${r.dest}).`, r.id);
      }
    } else {
      const nx = st[r.step];
      notify(r.emp, `${fullName(me())} a validé votre ${label} ${r.id}. Étape suivante : ${nx.label}.`, r.id);
      approversFor(r, nx.key).forEach(a => notify(a, `${r.id} (${who}) arrive à votre étape de validation.`, r.id));
    }
  } else if (act === 'reject') {
    r.status = 'rejected';
    notify(r.emp, `Votre ${label} ${r.id} a été rejetée : ${com}`, r.id);
  } else if (act === 'return') {
    r.status = 'returned'; r.step = 0;
    notify(r.emp, `Votre ${label} ${r.id} vous est retournée pour modification : ${com}`, r.id);
  }
  audit({ approve: 'Validation étape ' + cs.label, reject: 'Rejet', return: 'Retour pour modification' }[act], r.id, avant, stepLabel(r), com);
}

/* Contrôles d'une demande d'absence */
function checkAbsence(r, isNew) {
  const out = { errors: [], warnings: [], infos: [] };
  const e = emp(r.emp); const t = absType(r.type);
  if (!r.from || !r.to) return out;
  if (r.to < r.from) { out.errors.push('La date de fin est antérieure à la date de début.'); return out; }
  const days = workingDays(r.from, r.to, r.half);
  if (days === 0) out.errors.push('La période ne contient aucun jour ouvrable (week-end ou jour férié).');
  const mine = REQUESTS.filter(x => x.emp === r.emp && x.id !== r.id && ['pending', 'approved'].includes(x.status) && overlaps(r.from, r.to, x.from, x.to));
  mine.forEach(x => out.errors.push(`Chevauchement avec votre demande ${x.id} (${fd(x.from)} → ${fd(x.to)}).`));
  if (t.decompte) {
    const b = balance(e); const avail = isNew ? b.net : b.net + (r.status === 'pending' ? days : 0);
    if (days > avail) out.errors.push(`Solde insuffisant : ${num(days)} j demandés pour ${num(avail)} j disponibles.`);
  }
  if (t.justif && isNew && !r.piece) out.errors.push(`Une pièce justificative est obligatoire pour « ${t.name} ».`);
  if (isNew && r.from < TODAY) out.warnings.push('Demande rétroactive : elle sera contrôlée par le Département RH.');
  const team = EMP.filter(x => x.dept === e.dept && x.id !== e.id);
  const absent = team.filter(x => REQUESTS.some(q => q.emp === x.id && ['pending', 'approved'].includes(q.status) && overlaps(r.from, r.to, q.from, q.to)));
  if (absent.length) {
    const lvl = absent.length + 1 >= SETTINGS.seuilEquipe ? 'warnings' : 'infos';
    out[lvl].push(`Absences simultanées dans l’équipe ${orgName(e.dept)} : ${absent.map(fullName).join(', ')}.`);
  }
  if (t.code === 'CSS' || days > 15) out.infos.push('Cette demande nécessitera la validation de la Direction Générale.');
  return out;
}

  return m < n;
}

function toast(txt, kind = '') {
  const id = Math.random().toString(36).slice(2);
  S.toasts.push({ id, txt, kind }); if (S.toasts.length > 3) S.toasts.shift(); renderToasts();
  setTimeout(() => { S.toasts = S.toasts.filter(t => t.id !== id); renderToasts(); }, 4200);
}
function renderToasts() {
  $('#toasts').innerHTML = S.toasts.map(t => `<div class="toast ${t.kind}" role="${t.kind ? 'alert' : 'status'}">${ic(t.kind ? 'alert' : 'ok')}<span>${esc(t.txt)}</span></div>`).join('');
}

function stepper(r) {
  const st = stepsFor(r);
  const items = [{ label: 'Demandeur', who: fullName(emp(r.emp)), cls: 'done' }];
  st.forEach((s, i) => {
    const h = [...r.hist].reverse().find(x => x.step === s.key);
    let cls = '';
    if (r.status === 'approved' || i < r.step) cls = 'done';
    else if (i === r.step && r.status === 'pending') cls = 'cur';
    else if (i === r.step && r.status === 'rejected') cls = 'bad';
    else if (r.status === 'returned' && h && h.act === 'return') cls = 'ret';
    if (r.status === 'rejected') { const hr = r.hist.at(-1); if (hr && hr.step === s.key) cls = 'bad'; }
    items.push({ label: s.label, who: approverNames(r, s.key), cls });
  });
  items.push({ label: r.kind === 'MIS' ? 'Paiement & notification' : 'Notification & archivage', who: 'Services concernés', cls: r.status === 'approved' ? 'done' : '' });
  return `<ol class="steps" aria-label="Circuit de validation">${items.map(it => `<li class="${it.cls}"><span class="sd">${it.cls === 'done' ? ic('check') : it.cls === 'bad' ? ic('x') : it.cls === 'ret' ? ic('undo') : ''}</span>${esc(it.label)}<span class="who">${esc(it.who)}</span></li>`).join('')}</ol>`;
}

function histList(r) {
  const actTxt = { approve: 'a validé', reject: 'a rejeté', return: 'a retourné pour modification' };
  const rows = [{ date: r.created, txt: `<b>${esc(fullName(emp(r.emp)))}</b> a soumis la demande`, com: r.motif || r.objet }]
    .concat(r.hist.map(h => ({ date: h.date, txt: `<b>${esc(fullName(emp(h.by)))}</b> ${actTxt[h.act]} — étape ${esc((WORKFLOWS[r.kind].steps.find(s => s.key === h.step) || {}).label || h.step)}`, com: h.com })));
  return `<ul class="tl">${rows.map((x, i) => `<li class="${i === 0 ? 'brand' : ''}"><div class="when">${esc(fdt(x.date))}</div><div>${x.txt}</div>${x.com ? `<div class="small muted">« ${esc(x.com)} »</div>` : ''}</li>`).join('')}</ul>`;
}

function downloadCSV(name, rows) {
  const csv = '﻿' + rows.map(r => r.map(c => `"${String(c ?? '').replace(/"/g, '""')}"`).join(';')).join('\r\n');
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv;charset=utf-8' }));
  a.download = name; document.body.appendChild(a); a.click(); a.remove();
  toast(`Export ${name} téléchargé.`);
}

const STORE_KEY = 'kep-intranet-rh-v3';
const STORE = () => ({ EMP, REQUESTS, MISSIONS, EXPENSES, TRIPS, TICKETS, TIMESHEETS, DOCS, PLANNING, NOTIFS, AUDIT, ACCOUNTS, HOLIDAYS, ABS_TYPES });
function saveState() {
  try { localStorage.setItem(STORE_KEY, JSON.stringify({ arrays: STORE(), WORKFLOWS, PLAFONDS, SETTINGS, delegations: S.delegations })); } catch (e) { }
}
function loadState() {
  try {
    const raw = localStorage.getItem(STORE_KEY); if (!raw) return;
    const d = JSON.parse(raw); const st = STORE();
    Object.keys(st).forEach(k => { if (Array.isArray(d.arrays[k])) st[k].splice(0, st[k].length, ...d.arrays[k]); });
    Object.assign(WORKFLOWS, d.WORKFLOWS); Object.assign(PLAFONDS, d.PLAFONDS); Object.assign(SETTINGS, d.SETTINGS); S.delegations = d.delegations || S.delegations;
  } catch (e) { }
}
function resetState() { try { localStorage.removeItem(STORE_KEY); } catch (e) { } location.reload(); }
function genPassword() {
  const up = 'ABCDEFGHJKLMNPQRSTUVWXYZ', lo = 'abcdefghjkmnpqrstuvwxyz', pick = s => s[Math.floor(Math.random() * s.length)];
  return 'Kep-' + Array.from({ length: 4 }, () => pick('23456789')).join('') + '-' + pick(up) + pick(lo) + pick('#@!%');
}
function loginFor(e) {
  const base = (e.prenom[0] + '.' + e.nom).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/[^a-z.]/g, '');
  let l = base, i = 2; while (ACCOUNTS.some(a => a.login === l)) l = base + (i++);
  return l;
}

function renderNotifs() {
  const list = NOTIFS.filter(n => n.to === me().id);
  return `<div class="popover" role="dialog" aria-label="Notifications">
    <div class="panel-h"><h3>Notifications</h3><button class="btn ghost sm" data-act="notif-read">Tout marquer comme lu</button></div>
    <div style="max-height:420px;overflow:auto">${list.length ? list.map((n, i) => `<div class="notif ${n.read ? 'read' : 'unread'}"><span class="nd"></span><div><div>${esc(n.txt)}</div><div class="xs muted" style="margin-top:2px">${esc(fdt(n.date))}</div>${n.ref ? `<button class="btn ghost sm" style="margin:4px 0 0 -12px" data-act="open-item" data-arg="${n.ref}">Ouvrir ${n.ref}</button>` : ''}</div></div>`).join('') : empty('Aucune notification', 'Vous êtes à jour.')}</div></div>`;
}

function searchResults() {
  const q = S.search.trim().toLowerCase(); if (q.length < 2) return '';
  const res = [];
  if (isRHlike() || role() === 'N1') EMP.filter(e => (fullName(e) + ' ' + e.mat + ' ' + e.poste).toLowerCase().includes(q)).slice(0, 4).forEach(e => res.push({ act: 'open-emp', arg: e.id, t: fullName(e), s: `${e.mat} · ${e.poste}`, i: 'user' }));

function orgTree() {

/* ---------- Reporting ---------- */
function barsH(rows, color = 'var(--accent)') { const mx = Math.max(...rows.map(r => r[1]), 1); return rows.map(r => `<div class="bar-row"><span>${esc(r[0])}</span><span class="bar"><i style="width:${r[1] / mx * 100}%;background:${color}"></i></span><b class="num pill-n">${r[2] ?? r[1]}</b></div>`).join(''); }
function lineChart(vals, labels, { suffix = '', color = 'var(--accent)', ref = null, refLabel = '' } = {}) {
  const W = 640, H = 220, L = 44, R = 16, T = 16, B = 30; const mx = Math.max(...vals, ref || 0) * 1.15 || 1;
  const x = i => L + i * (W - L - R) / (vals.length - 1), y = v => T + (H - T - B) * (1 - v / mx);
  const ticks = [0, mx / 3, 2 * mx / 3].map(v => +v.toFixed(1));
  return `<div class="chart"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Évolution mensuelle">${ticks.map(t => `<line x1="${L}" x2="${W - R}" y1="${y(t)}" y2="${y(t)}" stroke="#ECECF0"/><text x="${L - 8}" y="${y(t) + 4}" text-anchor="end" font-size="13" fill="#6B6B78">${num(t)}${suffix}</text>`).join('')}
  ${ref != null ? `<line x1="${L}" x2="${W - R}" y1="${y(ref)}" y2="${y(ref)}" stroke="var(--brand)" stroke-dasharray="4 4"/><text x="${L + 6}" y="${y(ref) - 6}" text-anchor="start" font-size="12.5" fill="var(--brand-strong)">${refLabel}</text>` : ''}
  <polyline fill="none" stroke="${color}" stroke-width="2.25" points="${vals.map((v, i) => `${x(i)},${y(v)}`).join(' ')}"/>${vals.map((v, i) => `<circle cx="${x(i)}" cy="${y(v)}" r="3.5" fill="#fff" stroke="${color}" stroke-width="2"><title>${labels[i]} : ${num(v)}${suffix}</title></circle>`).join('')}
  ${labels.map((l, i) => `<text x="${x(i)}" y="${H - 8}" text-anchor="middle" font-size="13" fill="#6B6B78">${l}</text>`).join('')}<text x="${x(vals.length - 1)}" y="${y(vals.at(-1)) - 10}" text-anchor="middle" font-size="14" font-weight="600" fill="#16161D">${num(vals.at(-1))}${suffix}</text></svg></div>`;
}
function colChart(series, labels, names, colors) {
  const W = 640, H = 220, L = 56, R = 16, T = 16, B = 30; const mx = Math.max(...labels.map((_, i) => series.reduce((s, se) => Math.max(s, se[i]), 0))) * 1.15 || 1;
  const gw = (W - L - R) / labels.length, bw = Math.min(18, (gw - 10) / series.length);
  const y = v => T + (H - T - B) * (1 - v / mx); const ticks = [0, mx / 3, 2 * mx / 3];
  return `<div class="chart"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${names.join(', ')}">${ticks.map(t => `<line x1="${L}" x2="${W - R}" y1="${y(t)}" y2="${y(t)}" stroke="#ECECF0"/><text x="${L - 8}" y="${y(t) + 4}" text-anchor="end" font-size="13" fill="#6B6B78">${num(t / 1e6, 1)} M</text>`).join('')}
  ${labels.map((l, i) => series.map((se, k) => `<rect x="${L + i * gw + (gw - bw * series.length - 2 * (series.length - 1)) / 2 + k * (bw + 2)}" y="${y(se[i])}" width="${bw}" height="${H - B - y(se[i])}" rx="2" fill="${colors[k]}"><title>${l} · ${names[k]} : ${money(se[i])}</title></rect>`).join('') + `<text x="${L + i * gw + gw / 2}" y="${H - 8}" text-anchor="middle" font-size="13" fill="#6B6B78">${l}</text>`).join('')}</svg></div><div class="legend">${names.map((n, k) => `<span><i style="background:${colors[k]}"></i>${n}</span>`).join('')}</div>`;
}

/* ---------- Tiroirs (détails) ---------- */
function drawer(title, sub, body, foot = '') {
  return `<div class="scrim" data-act="close"></div><aside class="drawer" role="dialog" aria-modal="true" aria-label="${esc(title)}"><div class="drawer-h"><div><div class="small muted">${sub}</div><h2 style="margin-top:4px">${title}</h2></div><button class="icon-btn" data-act="close" aria-label="Fermer">${ic('x')}</button></div><div class="drawer-b">${body}</div>${foot ? `<div class="drawer-f">${foot}</div>` : ''}</aside>`;
}
function drawerItem(r) {

    const chk = checkAbsence(r, false); const b = balance(e);
    body += `<section class="panel" style="margin-bottom:20px"><div class="panel-b"><div class="person" style="margin-bottom:16px">${av(e)}<div><b>${esc(fullName(e))}</b><span>${e.mat} · ${esc(e.poste)} · ${esc(orgName(e.dept))}</span></div></div><dl class="dl"><dt>Type</dt><dd>${esc(absType(r.type).name)}</dd><dt>Période</dt><dd>${fd(r.from)} → ${fd(r.to)}</dd><dt>Jours ouvrables</dt><dd>${num(workingDays(r.from, r.to, r.half))} j${r.half ? ' (demi-journée incluse)' : ''}</dd><dt>Retour prévu</dt><dd>${fd(nextWorkday(r.to))}</dd><dt>Commentaire</dt><dd>${esc(r.motif || '—')}</dd><dt>Pièce justificative</dt><dd>${r.piece ? `<button class="btn ghost sm" style="margin-left:-12px" data-act="fake-dl" data-arg="${esc(r.piece)}">${ic('clip')}${esc(r.piece)}</button>` : '—'}</dd>${absType(r.type).decompte ? `<dt>Solde de l’agent</dt><dd>${num(b.dispo)} j disponibles · ${num(b.pend)} j en attente</dd>` : ''}</dl></div></section>`;
    if (r.status === 'pending') body += `<h3 style="margin-bottom:12px">Contrôles automatiques</h3><div class="stack" style="margin-bottom:24px">${chk.errors.map(x => `<div class="alert err">${ic('alert')}<div>${esc(x)}</div></div>`).join('')}${chk.warnings.map(x => `<div class="alert warn">${ic('alert')}<div>${esc(x)}</div></div>`).join('')}${chk.infos.map(x => `<div class="alert info">${ic('info')}<div>${esc(x)}</div></div>`).join('')}${!chk.errors.length && !chk.warnings.length ? `<div class="alert ok">${ic('ok')}<div>Solde suffisant, aucun chevauchement, aucune absence simultanée bloquante.</div></div>` : ''}</div>`;
  } else {
    const w = overCaps(r);
    body += `<section class="panel" style="margin-bottom:20px"><div class="panel-b"><div class="person" style="margin-bottom:16px">${av(e)}<div><b>${esc(fullName(e))}</b><span>${e.mat} · ${esc(e.poste)} · ${CATS[e.cat]}</span></div></div><dl class="dl"><dt>Objet</dt><dd>${esc(r.objet)}</dd><dt>Destination</dt><dd>${esc(r.dest)} · ${r.zone === 'local' ? 'mission locale' : 'mission à l’étranger'}</dd><dt>Dates</dt><dd>${fd(r.from)} → ${fd(r.to)} (${diffDays(r.from, r.to) + 1} jours)</dd><dt>Transport</dt><dd>${esc(r.transport)}</dd></dl></div></section>
    <h3 style="margin-bottom:12px">Avances demandées</h3><section class="panel" style="margin-bottom:20px"><table class="t"><tbody>${Object.entries(r.avances).map(([k, v]) => `<tr><td>${k}</td><td class="num">${money(v)}</td></tr>`).join('')}<tr><td><b>Total</b></td><td class="num"><b>${money(sumAv(r))}</b></td></tr></tbody></table></section>
    ${r.status === 'pending' ? `<div class="stack" style="margin-bottom:24px">${w.map(x => `<div class="alert warn">${ic('alert')}<div>${esc(x)}</div></div>`).join('') || `<div class="alert ok">${ic('ok')}<div>Avances conformes au barème ${CATS[e.cat].toLowerCase()} ${r.zone === 'local' ? 'local' : 'étranger'}.</div></div>`}</div>` : ''}`;
  }
  body += `<h3 style="margin-bottom:12px">Historique</h3>${histList(r)}`;
  let foot = '';
  if (can) {
    body += `<div class="sep"></div><div class="field"><label for="dec-com">Commentaire de décision <span class="muted">(obligatoire pour un rejet ou un retour)</span></label><textarea class="textarea" id="dec-com" placeholder="Ex. Relève organisée, accord."></textarea><span class="err-msg" id="dec-err" role="alert"></span></div>`;
    foot = `<button class="btn danger" data-act="decide" data-arg="reject">${ic('x')}Rejeter</button><button class="btn" data-act="decide" data-arg="return">${ic('undo')}Retourner pour modification</button><span style="flex:1"></span><button class="btn ok" data-act="decide" data-arg="approve">${ic('check')}Valider</button>`;
  } else if (r.emp === me().id && r.status === 'pending') foot = `<button class="btn danger" data-act="cancel-req">Annuler ma demande</button>`;
  else if (r.emp === me().id && r.status === 'returned' && r.kind === 'ABS') foot = `<button class="btn primary" data-act="edit-abs" data-arg="${r.id}">Corriger et resoumettre</button>`;
  return drawer(`<span class="mono" style="font-size:18px">${r.id}</span>`, r.kind === 'ABS' ? 'Demande d’absence' : 'Ordre de mission', body, foot);
}
function drawerNdf(n) {

};

const pwdOk = p => PWD_RULES.every(r => r[2](p));
const pwdRules = (p = '') => `<ul class="rules" id="pwd-rules">${PWD_RULES.map(r => `<li class="${r[2](p) ? 'ok' : ''}">${ic(r[2](p) ? 'check' : 'x')}${r[1]}</li>`).join('')}</ul>`;

const accBadge = a => a.status === 'actif' ? '<span class="badge b-ok">Actif</span>' : a.status === 'verrouillé' ? '<span class="badge b-err">Verrouillé</span>' : '<span class="badge b-muted">Désactivé</span>';

function openItem(id) {
  if (id.startsWith('NDF')) S.drawer = { type: 'ndf', id }; else S.drawer = { type: 'item', id };
  S.notifOpen = false; S.search = ''; render();
}
function closeOverlay() { S.drawer = null; S.modal = null; render(); }

const ACTIONS = {
  go: a => go(a),

  notif: () => { S.notifOpen = !S.notifOpen; render(); },

  'open-form': a => { S.draft = null; S.form = a; go('form'); },
  'edit-abs': a => { const r = findItem(a); S.draft = Object.assign({ kind: 'ABS' }, JSON.parse(JSON.stringify(r))); S.form = ['CA', 'REL', 'CSS'].includes(r.type) ? 'conge' : ['PERM', 'PF'].includes(r.type) ? 'permission' : 'absence'; go('form'); },
  'cancel-form': () => { S.draft = null; go('demandes'); },
  'abs-type': a => { syncAbsDraft(); S.draft.type = a; render(); },
  'new-mission': () => ACTIONS['open-form']('mission'),
  logout: () => { S.toasts = []; renderToasts(); if (S.user) audit('Déconnexion', S.user.login, '—', '—'); S.user = null; S.loginErr = ''; S.loginId = ''; S.view = 'home'; S.drawer = null; S.modal = null; S.tab = {}; S.draft = null; S.notifOpen = false; try { sessionStorage.removeItem('kep-session'); } catch (e) { } render(false); },
  'show-pwd': a => { const el = document.getElementById(a); el.type = el.type === 'password' ? 'text' : 'password'; el.focus(); },
  'reset-demo': () => resetState(),
  'acc-new': a => { S.modal = { type: 'acc-new', arg: a }; render(); },
  'acc-eye-all': () => { S.showAll = !S.showAll; S.showPwd = []; render(); },
  'acc-eye': a => { S.showPwd = S.showPwd || []; S.showPwd = S.showPwd.includes(a) ? S.showPwd.filter(x => x !== a) : [...S.showPwd, a]; render(); },
  'acc-reset': a => { const ac = ACCOUNTS.find(x => x.login === a); ac.pwd = genPassword(); ac.mustChange = true; ac.fails = 0; if (ac.status === 'verrouillé') ac.status = 'actif'; audit('Réinitialisation mot de passe', a, '—', 'Mot de passe provisoire'); S.modal = { type: 'acc-cred', arg: a, title: 'Mot de passe réinitialisé' }; render(); },
  'acc-role': a => { S.modal = { type: 'acc-role', arg: a }; render(); },

  'acc-del': a => { S.modal = { type: 'acc-del', arg: a }; render(); },
  'acc-del-ok': a => { const i = ACCOUNTS.findIndex(x => x.login === a); ACCOUNTS.splice(i, 1); audit('Suppression compte', a, 'Actif', 'Supprimé'); S.modal = null; render(); toast(`Compte ${a} supprimé. Le dossier RH est conservé.`); },
  'copy-cred': a => { const ac = ACCOUNTS.find(x => x.login === a); const txt = `Intranet RH KEP\nIdentifiant : ${ac.login}\nMot de passe : ${ac.pwd}`; try { navigator.clipboard.writeText(txt); toast('Identifiants copiés.'); } catch (e) { toast('Copie impossible dans ce navigateur.', 'err'); } },
  'export-acc': () => downloadCSV('KEP_comptes_intranet.csv', [['Matricule', 'Nom', 'Prénom', 'Poste', 'Département', 'Identifiant', 'Mot de passe', 'Profil', 'Statut'], ...ACCOUNTS.map(a => { const e = emp(a.emp); return [e.mat, e.nom, e.prenom, e.poste, orgName(e.dept), a.login, a.pwd, roleLabel(a.role), a.status]; })]),
  'mis-zone': a => { syncMisDraft(); S.draft.zone = a; render(); },

  'mis-suggest': () => { syncMisDraft(); const sg = suggestedAv(S.draft.zone, me().cat, S.draft.from, S.draft.to); S.draft.avLines = S.draft.avLines.filter(l => !['Hébergement', 'Per diem'].includes(l.n)); if (sg.Hébergement) S.draft.avLines.unshift({ n: 'Hébergement', a: sg.Hébergement }); S.draft.avLines.splice(1, 0, { n: 'Per diem', a: sg['Per diem'] }); render(); },
  decide: a => {
    const r = findItem(S.drawer.id); const com = $('#dec-com').value.trim();
    if (a !== 'approve' && !com) { $('#dec-err').textContent = 'Indiquez un motif : il sera transmis au demandeur.'; $('#dec-com').classList.add('bad'); $('#dec-com').focus(); return; }
    decide(r, a, com); S.drawer = null; render();
    toast({ approve: `${r.id} validée — ${r.status === 'approved' ? 'circuit terminé, services notifiés.' : 'transmise à l’étape suivante.'}`, reject: `${r.id} rejetée. Le demandeur est notifié.`, return: `${r.id} retournée au demandeur pour modification.` }[a]);
  },
  'cancel-req': () => { S.modal = { type: 'cancel', arg: S.drawer.id }; render(); },
  'cancel-confirm': a => { const r = findItem(a); const av = stepLabel(r); r.status = 'cancelled'; audit('Annulation par le demandeur', r.id, av, 'Annulée'); S.modal = null; S.drawer = null; render(); toast(`${a} annulée.`); },
  'new-deleg': () => { S.modal = { type: 'deleg' }; render(); },
  'fdt-ok': a => { const t = TIMESHEETS.find(x => x.id === a); t.status = 'approved'; audit('Validation feuille de temps', `${a} · ${fullName(emp(t.emp))}`, 'À valider', 'Validée'); notify(t.emp, `Votre feuille de temps ${t.sem} est validée.`); render(); toast(`Feuille de temps de ${fullName(emp(t.emp))} validée.`); },
  'new-ticket': a => { S.modal = { type: 'ticket', arg: a }; render(); },
  'tk-send': a => { const t = TICKETS.find(x => x.id === a); const txt = $('#tk-msg').value.trim(); if (!txt) { $('#tk-msg').focus(); return; } t.msgs.push({ by: me().id, date: nowStamp(), txt }); if (role() === 'ASSIST' && t.status === 'Nouveau') t.status = 'En cours'; notify(role() === 'ASSIST' ? t.emp : 5, `Nouveau message sur ${t.id} : ${t.objet}`); render(); toast('Message envoyé.'); },
  'tk-close': a => { const t = TICKETS.find(x => x.id === a); t.status = 'Clôturé'; audit('Clôture ticket assistance', a, 'En cours', 'Clôturé'); notify(t.emp, `Votre demande ${a} est clôturée.`); S.drawer = null; render(); toast(`${a} clôturé.`); },
  'trip-ok': a => { const t = TRIPS.find(x => x.id === a); t.status = 'Confirmé'; notify(t.emp, `Votre voyage ${t.dest} est confirmé. Fiche voyage disponible.`); render(); toast('Voyage confirmé, voyageur notifié.'); },
  'ndf-pay': a => { const n = EXPENSES.find(x => x.id === a); n.status = 'paid'; const t = ndfTotals(n); audit('Remboursement note de frais', a, 'En attente Finance', `Remboursée · ${money(t.acc)}`); notify(n.emp, `Votre note de frais ${a} est validée : ${money(t.acc)} acceptés.`); S.drawer = null; render(); toast(`${a} validée pour ${money(t.acc)}.`); },
  'new-ndf': a => { const mi = MISSIONS.find(x => x.id === a); S.modal = { type: 'ndf', arg: a, lines: [{ date: mi.from, cat: 'Restauration', four: '', montant: 0 }] }; render(); },
  'ndf-add': () => { syncNdf(); S.modal.lines.push({ date: MISSIONS.find(x => x.id === S.modal.arg).from, cat: 'Taxi', four: '', montant: 0 }); render(); },
  'ndf-del': a => { syncNdf(); S.modal.lines.splice(+a, 1); render(); },
  adjust: a => { S.modal = { type: 'adjust', arg: +a }; render(); },
  'new-emp': () => { S.modal = { type: 'emp' }; render(); },
  'new-doc': () => { S.modal = { type: 'doc' }; render(); },
  'new-prev': () => { S.modal = { type: 'prev' }; render(); },
  'lib-cat': a => { S.filters.libCat = a; render(); },
  'wf-toggle': a => { const [k, i] = a.split(':'); const s = WORKFLOWS[k].steps[i]; s.on = !s.on; audit('Paramétrage workflow', `${WORKFLOWS[k].name} · ${s.label}`, s.on ? 'Désactivée' : 'Activée', s.on ? 'Activée' : 'Désactivée'); render(); toast(`Étape « ${s.label} » ${s.on ? 'activée' : 'désactivée'}.`); },
  'wf-up': a => moveStep(a, -1), 'wf-down': a => moveStep(a, 1),
  'type-justif': a => { const t = ABS_TYPES[a]; t.justif = !t.justif; audit('Paramétrage type d’absence', t.name, 'Justificatif ' + (t.justif ? 'facultatif' : 'obligatoire'), 'Justificatif ' + (t.justif ? 'obligatoire' : 'facultatif')); render(); },
  'type-dec': a => { const t = ABS_TYPES[a]; t.decompte = !t.decompte; audit('Paramétrage type d’absence', t.name, t.decompte ? 'Non décompté' : 'Décompté', t.decompte ? 'Décompté' : 'Non décompté'); render(); },
  'hol-del': a => { const h = HOLIDAYS.splice(+a, 1)[0]; audit('Suppression jour férié', h[1], fd(h[0]), '—'); render(); },
  'toggle-sat': () => { SETTINGS.samedi = !SETTINGS.samedi; audit('Paramétrage calendrier', 'Samedi', SETTINGS.samedi ? 'Non travaillé' : 'Travaillé', SETTINGS.samedi ? 'Travaillé' : 'Non travaillé'); render(); },
  'export-emp': () => downloadCSV('KEP_personnel.csv', [['Matricule', 'Nom', 'Prénom', 'Poste', 'Direction', 'Département', 'Catégorie', 'Échelon', 'Contrat', 'Site', 'Régime', 'Date d’embauche', 'Solde congés (j)'], ...EMP.map(e => [e.mat, e.nom, e.prenom, e.poste, orgName(dirOf(e.dept)), orgName(e.dept), CATS[e.cat], e.ech, e.contrat, SITES[e.site], e.regime || 'Bureau', e.embauche, num(balance(e).net)])]),
  'export-mine': () => downloadCSV('Mes_absences.csv', [['Référence', 'Type', 'Début', 'Fin', 'Jours', 'Statut'], ...REQUESTS.filter(r => r.emp === me().id).map(r => [r.id, absType(r.type).name, r.from, r.to, num(workingDays(r.from, r.to, r.half)), stepLabel(r)])]),
  'export-pob': () => downloadCSV(`POB_offshore_${TODAY}.csv`, [['Matricule', 'Nom', 'Fonction', 'Régime', 'Nationalité'], ...EMP.filter(e => e.site === 'OFFSHORE' && e.regime && onSite(e, TODAY) && !absentOn(e, TODAY)).map(e => [e.mat, fullName(e), e.poste, e.regime, e.nat])]),
  'export-fin': () => downloadCSV('Suivi_missions_frais.csv', [['Mission', 'Agent', 'Destination', 'Début', 'Fin', 'Avance (XAF)', 'Statut'], ...MISSIONS.map(m => [m.id, fullName(emp(m.emp)), m.dest, m.from, m.to, sumAv(m), stepLabel(m)])]),
  'export-audit': () => downloadCSV('Journal_audit.csv', [['Date', 'Utilisateur', 'Action', 'Objet', 'Avant', 'Après', 'Motif', 'IP', 'Terminal'], ...AUDIT.map(a => [a.date, fullName(emp(a.by)), a.action, a.objet, a.avant, a.apres, a.motif, a.ip, a.term])]),
  'export-rep': a => downloadCSV(`KEP_reporting_${String(a).replace(/\W+/g, '_')}.csv`, [['Référence', 'Agent', 'Type', 'Début', 'Fin', 'Jours / montant', 'Statut'], ...REQUESTS.map(r => [r.id, fullName(emp(r.emp)), absType(r.type).name, r.from, r.to, num(workingDays(r.from, r.to, r.half)), stepLabel(r)]), ...MISSIONS.map(m => [m.id, fullName(emp(m.emp)), 'Mission', m.from, m.to, sumAv(m), stepLabel(m)])]),
  'export-csv-rep': a => ACTIONS['export-rep'](a),
};
function moveStep(a, d) { const [k, i] = a.split(':'); const st = WORKFLOWS[k].steps; const j = +i + d; if (j < 0 || j >= st.length) return; [st[i], st[j]] = [st[j], st[i]]; audit('Paramétrage workflow', WORKFLOWS[k].name, 'Ordre modifié', st.map(s => s.label).join(' → ')); render(); }

function syncAbsDraft() {
  const f = $('form[data-form="abs"]'); if (!S.draft) S.draft = { kind: 'ABS', type: 'CA' };
  if (!f) return; const fd_ = new FormData(f);
  Object.assign(S.draft, { type: fd_.get('type') || S.draft.type, from: fd_.get('from'), to: fd_.get('to'), half: fd_.get('half'), motif: fd_.get('motif'), piece: fd_.get('piece') || S.draft.piece });
}
function syncMisDraft() {
  const f = $('form[data-form="mis"]'); if (!S.draft) S.draft = { kind: 'MIS', zone: 'local', avLines: [] }; if (!f) return;
  const g = new FormData(f);
  Object.assign(S.draft, { objet: g.get('objet'), motif: g.get('motif'), dest: g.get('dest'), from: g.get('from'), to: g.get('to'), heure: g.get('heure'), transport: g.get('transport') });
  S.draft.avLines = S.draft.avLines.map((l, i) => ({ n: g.get('avn' + i) ?? l.n, a: +(g.get('ava' + i) ?? l.a) }));
}
function syncNdf() {
  const f = $('form[data-form="ndf"]'); if (!f) return; const g = new FormData(f);
  S.modal.lines = S.modal.lines.map((l, i) => ({ date: g.get('d' + i), cat: g.get('c' + i), four: g.get('f' + i), montant: +g.get('m' + i) || 0 }));
}

const FORMS = {
  login: f => {
    const g = new FormData(f); const id = String(g.get('login') || '').trim().toLowerCase(); const pw = String(g.get('pwd') || ''); S.loginId = id;
    if (!id || !pw) { S.loginErr = 'Saisissez votre identifiant et votre mot de passe.'; render(); return; }
    const a = ACCOUNTS.find(x => x.login === id);
    if (a && a.status === 'désactivé') { S.loginErr = 'Ce compte est désactivé. Contactez le Département RH.'; render(); return; }
    if (a && a.status === 'verrouillé') { S.loginErr = 'Compte verrouillé après 5 essais incorrects. Contactez le Département RH pour le débloquer.'; render(); return; }
    if (!a || a.pwd !== pw) {
      if (a) { a.fails = (a.fails || 0) + 1; if (a.fails >= 5) { a.status = 'verrouillé'; audit('Verrouillage compte', a.login, 'Actif', 'Verrouillé', '5 essais incorrects', a.emp); } }
      S.loginErr = a && a.status === 'verrouillé' ? 'Compte verrouillé après 5 essais incorrects. Contactez le Département RH pour le débloquer.' : `Identifiant ou mot de passe incorrect.${a && a.fails >= 3 ? ` Il vous reste ${5 - a.fails} essai(s).` : ''}`; render(); return;
    }
    a.fails = 0; a.last = nowStamp(); S.user = a; S.loginErr = ''; S.loginId = ''; S.tab = {};
    S.view = a.role === 'COLLAB' ? 'demandes' : 'home'; audit('Connexion', a.login, '—', '—');
    try { sessionStorage.setItem('kep-session', a.login); } catch (e) { }
    render(false); window.scrollTo(0, 0);
  },
  pwdinit: f => {
    const g = new FormData(f); const p1 = g.get('p1'), p2 = g.get('p2');
    if (!pwdOk(p1)) { S.loginErr = 'Le mot de passe ne respecte pas toutes les règles.'; render(); return; }
    if (p1 !== p2) { S.loginErr = 'Les deux mots de passe ne sont pas identiques.'; render(); return; }
    if (p1 === S.user.pwd) { S.loginErr = 'Choisissez un mot de passe différent du mot de passe provisoire.'; render(); return; }
    S.user.pwd = p1; S.user.mustChange = false; S.loginErr = ''; audit('Changement mot de passe (1re connexion)', S.user.login, 'Provisoire', 'Personnalisé'); render(false); toast('Mot de passe enregistré. Bienvenue sur l’intranet RH.');
  },
  pwd: f => {
    const g = new FormData(f); const err = t => { $('#cp-err').textContent = t; };
    if (g.get('p0') !== S.user.pwd) return err('Le mot de passe actuel est incorrect.');
    if (!pwdOk(g.get('p1'))) return err('Le nouveau mot de passe ne respecte pas toutes les règles.');
    if (g.get('p1') !== g.get('p2')) return err('Les deux mots de passe ne sont pas identiques.');
    S.user.pwd = g.get('p1'); audit('Changement mot de passe', S.user.login, '—', 'Personnalisé'); render(); toast('Mot de passe mis à jour.');
  },
  accnew: f => {
    const g = new FormData(f); const r = g.get('role');
    if (!assignableRoles().some(x => x.code === r)) { toast('Ce profil ne peut être attribué que par la DIRH.', 'err'); return; }
    let e;
    if (g.get('emp')) e = emp(+g.get('emp'));
    else {
      const miss = ['prenom', 'nom', 'poste'].find(k => !String(g.get(k) || '').trim());
      if (miss) { const el = f.querySelector(`[name=${miss}]`); el.classList.add('bad'); el.focus(); toast('Renseignez le prénom, le nom et le poste.', 'err'); return; }
      const id = Math.max(...EMP.map(x => x.id)) + 1; const dept = g.get('dept'); const mgrE = EMP.find(x => x.dept === dept && ['C', 'CS'].includes(x.cat));
      e = { id, prenom: g.get('prenom').trim(), nom: g.get('nom').trim(), sexe: 'M', poste: g.get('poste').trim(), dept, cat: g.get('cat'), ech: '1', contrat: g.get('contrat'), site: g.get('regime') ? 'OFFSHORE' : 'SIEGE', mgr: mgrE ? mgrE.id : 2, embauche: TODAY, regime: g.get('regime') || null, rot: g.get('regime') ? TODAY : null, nat: 'Congolaise', naiss: '1995-01-01', solde: { rel: 0, acq: 0, pris: 0 } };
      e.mat = 'KEP-' + String(id).padStart(4, '0'); e.email = loginFor(e) + '@kep-congo.com'; e.tel = '—'; EMP.push(e); audit('Immatriculation', `${e.mat} · ${fullName(e)}`, '—', 'Dossier créé');
    }
    const a = { login: loginFor(e), emp: e.id, role: r, pwd: genPassword(), status: 'actif', mustChange: false, created: TODAY, last: null, fails: 0 };
    ACCOUNTS.push(a); audit('Création compte', a.login, '—', roleLabel(r)); S.modal = { type: 'acc-cred', arg: a.login, title: `Compte créé pour ${fullName(e)}` }; render();
  },
  accrole: f => {
    const g = new FormData(f); const a = ACCOUNTS.find(x => x.login === g.get('login')); const r = g.get('role');
    if (!assignableRoles().some(x => x.code === r)) { toast('Ce profil ne peut être attribué que par la DIRH.', 'err'); return; }
    const av = roleLabel(a.role); a.role = r; audit('Changement de profil', a.login, av, roleLabel(r)); S.modal = null; render(); toast(`Profil de ${a.login} : ${roleLabel(r)}.`);
  },
  abs: f => {
    syncAbsDraft(); const d = S.draft; const isEdit = !!d.id;
    const r = { emp: me().id, id: d.id || 'NEW', type: d.type, from: d.from, to: d.to, half: d.half, motif: d.motif, piece: d.piece, status: 'new' };
    if (!d.from || !d.to) { toast('Renseignez les dates de début et de fin.', 'err'); (d.from ? $('#f-to') : $('#f-from')).focus(); return; }
    const chk = checkAbsence(r, true);
    if (chk.errors.length) { $('#abs-calc').scrollIntoView({ block: 'center', behavior: 'smooth' }); toast('La demande ne peut pas être soumise : corrigez les points signalés.', 'err'); return; }
    if (isEdit) { const o = findItem(d.id); Object.assign(o, { type: d.type, from: d.from, to: d.to, half: d.half, motif: d.motif, piece: d.piece, status: 'pending', step: 0 }); audit('Resoumission', o.id, 'Retournée', 'En attente N+1'); notify(me().mgr, `${o.id} (${fullName(me())}) a été corrigée et resoumise.`, o.id); }
    else {
      const id = 'ABS-2026-' + String(161 + REQUESTS.length).padStart(4, '0');
      REQUESTS.unshift({ id, kind: 'ABS', emp: me().id, type: d.type, from: d.from, to: d.to, half: d.half, motif: d.motif, piece: d.piece, created: TODAY, status: 'pending', step: 0, hist: [] });
      audit('Création demande d’absence', id, '—', 'En attente N+1'); notify(me().mgr, `Nouvelle demande ${id} de ${fullName(me())} : ${absType(d.type).name}, ${num(workingDays(d.from, d.to, d.half))} j.`, id);
      if (me().mgr == null || stepsFor(REQUESTS[0]).length === 0) { REQUESTS[0].status = 'approved'; }
      d.id = id;
    }
    const id = d.id; S.draft = null; go('suivi'); toast(`Demande ${id} soumise à ${fullName(emp(me().mgr))}.`);
  },
  mis: f => {
    syncMisDraft(); const d = S.draft;
    const miss = [['objet', '#m-objet'], ['dest', '#m-dest'], ['from', '#m-from'], ['to', '#m-to']].find(([k]) => !d[k]);
    if (miss) { $(miss[1]).classList.add('bad'); $(miss[1]).focus(); toast('Complétez les champs obligatoires.', 'err'); return; }
    if (d.to < d.from) { $('#m-to').classList.add('bad'); $('#m-to').focus(); toast('La date de retour précède la date de départ.', 'err'); return; }
    const id = 'MIS-2026-' + String(58 + MISSIONS.length).padStart(4, '0'); const av = {}; d.avLines.forEach(l => { if (+l.a > 0) av[l.n] = (av[l.n] || 0) + +l.a; });
    MISSIONS.unshift({ id, kind: 'MIS', emp: me().id, objet: d.objet, dest: d.dest, zone: d.zone, from: d.from, to: d.to, transport: d.transport, avances: av, created: TODAY, status: 'pending', step: 0, hist: [] });
    TRIPS.unshift({ id: 'VOY-2026-' + String(119 + TRIPS.length).padStart(4, '0'), mission: id, emp: me().id, dest: d.dest, from: d.from, to: d.to, vol: `${d.transport} · départ ${fd(d.from)} ${d.heure || ''} · à réserver`, retour: `Retour ${fd(d.to)} · à réserver`, hotel: 'À réserver après validation', assurance: 'Assistance rapatriement · contrat ASS-2026-114', visa: d.zone === 'etranger' ? 'À vérifier' : 'Non requis', transfert: 'À organiser', status: 'En attente de validation' });
    audit('Création ordre de mission', id, '—', 'En attente N+1'); notify(me().mgr, `Nouvel ordre de mission ${id} de ${fullName(me())} : ${d.dest}.`, id);
    S.draft = null; go('suivi'); toast(`Ordre de mission ${id} soumis. Dossier voyage créé.`);
  },
  ticket: f => { const g = new FormData(f); if (!g.get('objet')) return; const id = 'AST-' + String(416 + TICKETS.length).padStart(4, '0'); TICKETS.unshift({ id, trip: g.get('trip'), emp: me().id, objet: g.get('objet'), desc: g.get('desc'), prio: g.get('prio'), status: 'Nouveau', created: nowStamp(), msgs: [{ by: me().id, date: nowStamp(), txt: g.get('desc') || g.get('objet') }] }); notify(5, `Nouvelle demande d’assistance ${id} — ${g.get('objet')}`); audit('Création ticket assistance', id, '—', 'Nouveau'); S.modal = null; if (S.view === 'form') go('suivi'); else render(); toast(`Demande ${id} transmise à l’assistance voyage.`); },
  deleg: f => { const g = new FormData(f); if (g.get('au') < g.get('du')) { toast('La date de fin précède la date de début.', 'err'); return; } S.delegations.unshift({ from: me().id, to: +g.get('to'), du: g.get('du'), au: g.get('au'), motif: g.get('motif') || 'Absence' }); audit('Délégation de validation', fullName(emp(+g.get('to'))), '—', `${g.get('du')} → ${g.get('au')}`, g.get('motif')); notify(+g.get('to'), `${fullName(me())} vous délègue ses validations du ${fd(g.get('du'))} au ${fd(g.get('au'))}.`); S.modal = null; render(); toast('Délégation enregistrée, délégataire notifié.'); },
  adjust: f => { const g = new FormData(f); if (!g.get('motif').trim()) { $('#aj-m').classList.add('bad'); $('#aj-m').focus(); return; } const e = emp(+g.get('id')); const av = `Reliquat ${e.solde.rel} j · pris ${e.solde.pris} j`; e.solde.rel = +g.get('rel'); e.solde.pris = +g.get('pris'); audit('Correction solde de congés', `${e.mat} · ${fullName(e)}`, av, `Reliquat ${e.solde.rel} j · pris ${e.solde.pris} j`, g.get('motif')); S.modal = null; render(); toast('Solde corrigé et tracé au journal d’audit.'); },
  emp: f => { const g = new FormData(f); const id = EMP.length + 1; const dept = g.get('dept'); const mgrE = EMP.find(e => e.dept === dept && ['C', 'CS'].includes(e.cat)); const ne = { id, prenom: g.get('prenom'), nom: g.get('nom'), sexe: 'M', poste: g.get('poste'), dept, cat: g.get('cat'), ech: '1', contrat: g.get('contrat'), site: g.get('regime') ? 'OFFSHORE' : 'SIEGE', mgr: mgrE ? mgrE.id : 2, embauche: TODAY, regime: g.get('regime') || null, rot: g.get('regime') ? TODAY : null, nat: 'Congolaise', naiss: '1995-01-01', solde: { rel: 0, acq: 0, pris: 0 } }; ne.mat = 'KEP-' + String(id).padStart(4, '0'); ne.email = (ne.prenom[0] + '.' + ne.nom).toLowerCase() + '@kep-congo.com'; ne.tel = '—'; EMP.push(ne); audit('Immatriculation', `${ne.mat} · ${fullName(ne)}`, '—', 'Dossier créé'); const acc = { login: loginFor(ne), emp: ne.id, role: 'COLLAB', pwd: genPassword(), status: 'actif', mustChange: false, created: TODAY, last: null, fails: 0 }; ACCOUNTS.push(acc); audit('Création compte', acc.login, '—', 'Employé'); S.modal = { type: 'acc-cred', arg: acc.login, title: `${fullName(ne)} immatriculé(e) sous ${ne.mat}` }; render(); },
  doc: f => { const g = new FormData(f); DOCS.unshift({ id: DOCS.length + 1, titre: g.get('titre'), cat: g.get('cat'), tags: (g.get('tags') || '').split(',').map(s => s.trim()).filter(Boolean), version: '1.0', effet: g.get('effet'), maj: TODAY, taille: '—', acces: g.get('acces'), hist: [], nouveau: true }); const n = g.get('acces') === 'Tous' ? EMP.length : 8; EMP.forEach(e => (g.get('acces') === 'Tous' || [1, 2, 3, 20].includes(e.id)) && notify(e.id, `Nouveau document publié : ${g.get('titre')}.`)); audit('Publication document', g.get('titre'), '—', 'v1.0'); S.modal = null; render(); toast(`Document publié. ${n} utilisateurs notifiés.`); },
  prev: f => { const g = new FormData(f); let p = PLANNING.find(x => x.emp === me().id); if (!p) PLANNING.push(p = { emp: me().id, prev: [], eff: [] }); p.prev.push([g.get('from'), g.get('to')]); notify(me().mgr, `${fullName(me())} a saisi ses dates prévisionnelles : avis attendu.`); S.modal = null; render(); toast('Dates prévisionnelles enregistrées, avis du N+1 demandé.'); },
  ndf: f => { syncNdf(); const lines = S.modal.lines.filter(l => l.montant > 0); if (!lines.length) { toast('Ajoutez au moins une dépense avec un montant.', 'err'); return; } const id = 'NDF-2026-' + String(32 + EXPENSES.length).padStart(4, '0'); EXPENSES.unshift({ id, mission: S.modal.arg, emp: me().id, created: TODAY, status: 'pending', lines: lines.map(l => ({ ...l, devise: 'XAF', paie: 'Espèces', piece: 'justificatif.jpg', motif: '' })), decisions: {} }); notify(4, `Nouvelle note de frais ${id} de ${fullName(me())}.`); audit('Création note de frais', id, '—', 'En attente Finance'); S.modal = null; if (S.view === 'form') go('suivi'); else render(); toast(`Note de frais ${id} soumise à la Finance.`); },
  fdt: f => { const g = new FormData(f); const h = Array.from({ length: 7 }, (_, i) => +g.get('h' + i) || 0); if (h.some(x => x > 16)) { toast('Une journée dépasse 16 heures : vérifiez la saisie.', 'err'); return; } TIMESHEETS.unshift({ id: 'FDT-42-' + me().id, emp: me().id, sem: 'S42 · 12/10 → 18/10', jours: h, status: 'pending' }); notify(me().mgr, `Feuille de temps S42 de ${fullName(me())} à valider.`); if (S.view === 'form') go('suivi'); else render(); toast('Feuille de temps soumise.'); },
  hol: f => { const g = new FormData(f); HOLIDAYS.push([g.get('d'), g.get('l')]); HOLIDAYS.sort((a, b) => a[0].localeCompare(b[0])); audit('Ajout jour férié', g.get('l'), '—', fd(g.get('d'))); render(); toast('Jour férié ajouté au calendrier.'); },
};

document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if (S.notifOpen && !e.target.closest('.popover') && !(el && el.dataset.act === 'notif')) { S.notifOpen = false; if (!el) { render(); return; } }
  if (S.search && !e.target.closest('.search')) { S.search = ''; if (!el) { render(); return; } }
  if (!el) return; const fn = ACTIONS[el.dataset.act]; if (!fn) return;
  if (el.getAttribute('type') === 'submit') return;
  e.preventDefault(); fn(el.dataset.arg);
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') { if (S.modal || S.drawer) closeOverlay(); else if (S.notifOpen || S.search) { S.notifOpen = false; S.search = ''; render(); } }
  if ((e.key === 'Enter' || e.key === ' ') && e.target.matches('tr[data-act], .list-row[data-act]')) { e.preventDefault(); e.target.click(); }
});
document.addEventListener('submit', e => { const f = e.target.closest('form[data-form]'); if (!f) return; e.preventDefault(); FORMS[f.dataset.form](f); });
document.addEventListener('input', e => {
  const t = e.target;
  if (t.id === 'q') { S.search = t.value; render(); return; }
  if (t.id === 'pers-q') { S.filters.pers = t.value; render(); return; }
  if (t.id === 'lib-q') { S.filters.libQ = t.value; render(); return; }
  if (t.id === 'aud-q') { S.filters.audQ = t.value; render(); return; }
  if (t.id === 'acc-q') { S.filters.accQ = t.value; render(); return; }
  if (t.dataset.rules) { $('#pwd-rules').outerHTML = pwdRules(t.value); return; }
  t.classList.remove('bad');
  if (t.closest('form[data-form="abs"]')) { syncAbsDraft(); const d = S.draft; $('#abs-calc').innerHTML = absCalc({ emp: me().id, id: d.id || 'NEW', type: d.type, from: d.from, to: d.to, half: d.half, piece: d.piece, status: d.status }, true); }
  if (t.closest('form[data-form="mis"]') && t.name && t.name.startsWith('ava')) { syncMisDraft(); $('#mis-total').textContent = money(S.draft.avLines.reduce((s, l) => s + (+l.a || 0), 0)); }
  if (t.dataset.wf) { const [k, i] = t.dataset.wf.split(':'); WORKFLOWS[k].steps[i].delai = +t.value; }
  if (t.dataset.cap) { const [z, k, c] = t.dataset.cap.split(':'); PLAFONDS[z][k][c] = +t.value; }
});
document.addEventListener('change', e => {
  const t = e.target;
  if (t.id === 'acc-role') { S.filters.accRole = t.value; render(); }
  if (t.id === 'acc-st') { S.filters.accSt = t.value; render(); }
  if (t.id === 'ar-r') { $('#ar-d').innerHTML = DROITS[t.value].map(d => `<li>${ic('check')}${esc(d)}</li>`).join(''); }
  if (t.closest('form[data-form="mis"]') && ['from', 'to'].includes(t.name)) { syncMisDraft(); render(); return; }
  if (t.id === 'pers-dir') { S.filters.persDir = t.value; render(); }
  if (t.id === 'plan-dir') { S.filters.planDir = t.value; render(); }
  if (t.id === 'rot-site') { S.filters.rotSite = t.value; render(); }
  if (t.dataset.ndf) { const [id, i] = t.dataset.ndf.split(':'); const n = EXPENSES.find(x => x.id === id); n.decisions[i] = t.value; render(); }
  if (t.type === 'file' && t.closest('form[data-form="abs"]') && t.files[0]) { syncAbsDraft(); S.draft.piece = t.files[0].name; render(); }
  if (t.dataset.wf) { const [k, i] = t.dataset.wf.split(':'); audit('Paramétrage workflow', `${WORKFLOWS[k].name} · ${WORKFLOWS[k].steps[i].label}`, '—', `Relance après ${t.value} j`); toast('Délai de relance enregistré.'); }
  if (t.dataset.cap) { audit('Paramétrage plafond de frais', t.getAttribute('aria-label'), '—', money(+t.value)); toast('Plafond mis à jour.'); }
});

loadState();
try { const l = sessionStorage.getItem('kep-session'); const a = l && ACCOUNTS.find(x => x.login === l && x.status === 'actif'); if (a) { S.user = a; S.view = a.role === 'COLLAB' ? 'demandes' : 'home'; } } catch (e) { }
render();

</script></body></html>
